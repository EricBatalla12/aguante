# Publica la web de Aguante (carpeta web/) en GitHub Pages cada vez que cambia en main.
# La calculadora usa js/lib/calculo.js, compilado de src/lib/calculo.ts con `npm run sitio`:
# si cambia el cálculo, recompilar y subirlo junto con el cambio.
name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v5
