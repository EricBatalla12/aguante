# Copia semanal de productos y precios de la tienda online de Mercadona a
# Supabase (ver scripts/precios-tiendas.mjs). Lunes a las 05:23 (UTC); también
# se puede lanzar a mano desde la pestaña Actions. Necesita el secreto
# PRECIOS_TOKEN (su huella está en privado.claves, ver supabase/esquema.sql).
name: Precios de las tiendas

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/precios-tiendas.mjs
        env:
          PRECIOS_TOKEN: ${{ secrets.PRECIOS_TOKEN }}
